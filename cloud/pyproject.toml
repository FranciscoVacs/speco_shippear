[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speco-cloud"
version = "0.1.0"
description = "Multi-tenant service for Speco: GitHub App webhooks, API and review worker on Postgres (Supabase). Separate from the dependency-free review engine (D-008)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "specreview>=0.2",            # the review engine, used as a library by the worker
]

[tool.setuptools.packages.find]
include = ["speco_cloud*"]
